name: Bug
description: Something doesn't work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of ./studio doctor
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs (studio-data/logs/api.log, worker.log) — last lines
      render: text
